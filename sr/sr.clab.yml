name: sr

topology:
  defaults:
    kind: linux
  nodes:
    R1:
      image: frr
      memory: 256mb
      binds: 
      - daemons:/etc/frr/daemons
      - R1.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.mpls.conf.lo.input=1
      - sysctl -w net.mpls.conf.eth1.input=1
      - sysctl -w net.mpls.conf.eth2.input=1
      - sysctl -w net.mpls.platform_labels=1048575
      - ip route del 0.0.0.0/0
      - ip route del 172.20.20.0/24 dev eth0
    R2:
      image: frr
      memory: 256mb
      binds: 
      - daemons:/etc/frr/daemons
      - R2.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.mpls.conf.lo.input=1
      - sysctl -w net.mpls.conf.eth1.input=1
      - sysctl -w net.mpls.conf.eth2.input=1
      - sysctl -w net.mpls.conf.eth3.input=1
      - sysctl -w net.mpls.platform_labels=1048575
      - ip route del 0.0.0.0/0
      - ip route del 172.20.20.0/24 dev eth0
    R3:
      image: frr
      memory: 256mb
      binds: 
      - daemons:/etc/frr/daemons
      - R3.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.mpls.conf.lo.input=1
      - sysctl -w net.mpls.conf.eth1.input=1
      - sysctl -w net.mpls.conf.eth2.input=1
      - sysctl -w net.mpls.conf.eth3.input=1
      - sysctl -w net.mpls.conf.eth4.input=1
      - sysctl -w net.mpls.platform_labels=1048575
      - ip route del 0.0.0.0/0
      - ip route del 172.20.20.0/24 dev eth0
    R4:
      image: frr
      memory: 256mb
      binds: 
      - daemons:/etc/frr/daemons
      - R4.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.mpls.conf.lo.input=1
      - sysctl -w net.mpls.conf.eth1.input=1
      - sysctl -w net.mpls.conf.eth2.input=1
      - sysctl -w net.mpls.conf.eth3.input=1
      - sysctl -w net.mpls.platform_labels=1048575
      - ip route del 0.0.0.0/0
      - ip route del 172.20.20.0/24 dev eth0
    R5:
      image: frr
      memory: 256mb
      binds: 
      - daemons:/etc/frr/daemons
      - R5.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.mpls.conf.lo.input=1
      - sysctl -w net.mpls.conf.eth1.input=1
      - sysctl -w net.mpls.conf.eth2.input=1
      - sysctl -w net.mpls.platform_labels=1048575
      - ip route del 0.0.0.0/0
      - ip route del 172.20.20.0/24 dev eth0
    H11:
      image: vpc
      memory: 10m
      exec:
      - ip addr add 192.168.111.11/24 dev eth1
      - ip route replace 0/0 via 192.168.111.1
      - ip route del 172.20.20.0/24 dev eth0
    H55:
      image: vpc
      memory: 10m
      exec:
      - ip addr add 192.168.155.55/24 dev eth1
      - ip route replace 0/0 via 192.168.155.1
      - ip route del 172.20.20.0/24 dev eth0
  links:
    - endpoints: ["R1:eth1", "R3:eth1"]
    - endpoints: ["R1:eth2", "R2:eth1"]
    - endpoints: ["R2:eth2", "R3:eth2"]
    - endpoints: ["R2:eth3", "R4:eth1"]
    - endpoints: ["R4:eth2", "R3:eth3"]
    - endpoints: ["R4:eth3", "R5:eth1"]
    - endpoints: ["R3:eth4", "R5:eth2"]
    - endpoints: ["R1:eth3", "H11:eth1"]
    - endpoints: ["R5:eth3", "H55:eth1"]

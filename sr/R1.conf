service integrated-vtysh-config
frr defaults traditional
hostname R1
no ipv6 forwarding
!
affinity-map RED bit-position 0
!
interface eth1
 ip address 20.0.13.1/30
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 2
 isis hello-multiplier 5
 link-params
  enable
  affinity RED
 exit-link-params
exit
!
interface eth2
 ip address 20.0.12.1/30
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 2
 isis hello-multiplier 5
 link-params
  enable
 exit-link-params
exit
!
interface eth3
 ip address 192.168.111.1/24
exit
!
interface lo
 ip address 1.1.1.1/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-1
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 mpls-te router-address 1.1.1.1
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 1.1.1.1/32 index 100
exit
!
router bgp 100
 bgp router-id 1.1.1.1
 neighbor 5.5.5.5 remote-as 100
 neighbor 5.5.5.5 update-source lo
 !
 address-family ipv4 unicast
  network 192.168.111.0/24
 exit-address-family
exit
!
line vty
exit
!
end

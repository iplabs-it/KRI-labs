service integrated-vtysh-config
frr defaults traditional
hostname R2
no ipv6 forwarding
!
interface eth1
 ip address 20.0.12.2/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 10
 link-params
  enable
 exit-link-params
exit
!
interface eth2
 ip address 20.0.23.1/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 10
 link-params
  enable
 exit-link-params
exit
!
interface eth3
 ip address 20.0.24.1/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 10
 link-params
  enable
 exit-link-params
exit
!
interface lo
 ip address 2.2.2.2/32
exit
!
router ospf
 ospf router-id 2.2.2.2
 network 2.2.2.2/32 area 0.0.0.0
 network 20.0.0.0/16 area 0.0.0.0
 capability opaque
 mpls-te on
 mpls-te router-address 2.2.2.2
 router-info area 0.0.0.0
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 2.2.2.2/32 index 200
exit
!
line vty
!

service integrated-vtysh-config
frr defaults traditional
hostname R5
no ipv6 forwarding
!
interface eth1
 ip address 20.0.45.2/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 10
 link-params
  enable
 exit-link-params
exit
!
interface eth2
 ip address 20.0.35.2/30
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 10
 link-params
  enable
 exit-link-params
exit
!
interface eth3
 ip address 192.168.155.1/24
exit
!
interface lo
 ip address 5.5.5.5/32
exit
!
router ospf
 ospf router-id 5.5.5.5
 network 5.5.5.5/32 area 0.0.0.0
 network 20.0.0.0/16 area 0.0.0.0
 capability opaque
 mpls-te on
 mpls-te router-address 5.5.5.5
 router-info area 0.0.0.0
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 5.5.5.5/32 index 500
exit
!
router bgp 100
 bgp router-id 5.5.5.5
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source lo
 neighbor 1.1.1.1 send-community
 !
 address-family ipv4 unicast
  network 192.168.155.0/24
 exit-address-family
exit
!
line vty
!

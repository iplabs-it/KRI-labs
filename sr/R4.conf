service integrated-vtysh-config
frr defaults traditional
hostname R4
no ipv6 forwarding
!
affinity-map RED bit-position 0
!
interface eth1
 ip address 20.0.24.2/30
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 2
 isis hello-multiplier 5
 link-params
  enable
 exit-link-params
exit
!
interface eth2
 ip address 20.0.34.2/30
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 2
 isis hello-multiplier 5
 link-params
  enable
 exit-link-params
exit
!
interface eth3
 ip address 20.0.45.1/30
 ip router isis CORE
 isis network point-to-point
 isis hello-interval 2
 isis hello-multiplier 5
 link-params
  enable
 exit-link-params
exit
!
interface lo
 ip address 4.4.4.4/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 net 49.0001.0000.0000.0004.00
 is-type level-1
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 mpls-te router-address 4.4.4.4
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 4.4.4.4/32 index 400
exit
!
line vty
exit
!
end

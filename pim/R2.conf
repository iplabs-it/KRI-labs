frr defaults traditional
hostname R2
no ipv6 forwarding
!
interface lo
 ip address 2.2.2.2/32
exit
!
interface eth1
 ip address 192.168.12.2/24
exit
!
interface eth2
 ip address 192.168.24.2/24
exit
!
router ospf
 network 192.168.12.0/24 area 0
 network 192.168.24.0/24 area 0
 network 2.2.2.2/32 area 0
exit
!

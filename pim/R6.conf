frr defaults traditional
hostname R6
no ipv6 forwarding
!
interface lo
 ip address 6.6.6.6/32
exit
!
interface eth1
 ip address 192.168.46.6/24
exit
!
interface eth2
 ip address 192.168.36.6/24
exit
!
interface eth3
 ip address 192.168.5.1/24
exit
!
interface eth4
 ip address 192.168.6.1/24
exit
!
router ospf
 network 192.168.46.0/24 area 0
 network 192.168.36.0/24 area 0
 network 192.168.5.0/24 area 0
 network 192.168.6.0/24 area 0
 network 6.6.6.6/32 area 0
exit
!
